    <!-- Lógica do Sistema em JavaScript -->
    <script>
        // Inicializa o AutoAnimate na lista para transições de reordenação suaves
        const companyListEl = document.getElementById('company-list');
        if (window.formkitAutoAnimate) {
            window.formkitAutoAnimate(companyListEl, { duration: 300, easing: 'ease-out' });
        }

        // Estado
        let companies = [];
        let editingId = null;
        
        const apiUrl = 'api.php';

        const addFormEl = document.getElementById('add-form');
        const newCompanyNameEl = document.getElementById('new-company-name');
        
        // --- Comunicação com a API ---
        async function fetchCompanies() {
            try {
                const res = await fetch(apiUrl);
                companies = await res.json();
                render();
            } catch (err) {
                console.error('Erro ao buscar empresas:', err);
            }
        }

        async function apiAddCompany(name) {
            try {
                await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, stars: 0 })
                });
                await fetchCompanies(); // Recarrega lista
            } catch (err) {
                console.error('Erro ao adicionar empresa:', err);
            }
        }

        async function apiUpdateCompany(id, updates) {
            try {
                await fetch(apiUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, ...updates })
                });
                await fetchCompanies();
            } catch (err) {
                console.error('Erro ao atualizar empresa:', err);
            }
        }

        async function apiDeleteCompany(id) {
            try {
                await fetch(apiUrl, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                await fetchCompanies();
            } catch (err) {
                console.error('Erro ao deletar empresa:', err);
            }
        }

        // --- Geração de PDF ---
        async function exportPDF() {
            const btn = document.querySelector('button[onclick="exportPDF()"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Gerando...';
            btn.disabled = true;

            try {
                // Preenche a tabela do PDF
                const tbody = document.getElementById('pdf-table-body');
                tbody.innerHTML = '';
                
                companies.forEach((company, index) => {
                    const row = document.createElement('div');
                    row.className = 'flex items-center border-b border-gray-200/50 py-1.5';
                    if(index % 2 !== 0) row.classList.add('bg-[#eaedf1]'); // Efeito zebrado sutil
                    
                    let starsHtml = '';
                    for(let i=0; i<15; i++) {
                        if(i < company.stars) {
                            starsHtml += '<i class="fa-solid fa-star text-[#1b5e20] mx-0.5 text-sm drop-shadow-sm"></i>';
                        }
                    }

                    row.innerHTML = `
                        <div class="w-16 text-center font-black text-[#1a365d] text-base">${index + 1}</div>
                        <div class="w-72 text-[#1a365d] font-bold px-4 text-base truncate">${company.name}</div>
                        <div class="flex-1 flex px-4 items-center">
                            ${starsHtml}
                        </div>
                    `;
                    tbody.appendChild(row);
                });

                // Gera o PDF
                const element = document.getElementById('pdf-content');
                const opt = {
                    margin:       0,
                    filename:     'Ranking-Participacao-Sebrae.pdf',
                    image:        { type: 'jpeg', quality: 1.0 },
                    html2canvas:  { scale: 2, useCORS: true, logging: false },
                    jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
                };

                await html2pdf().set(opt).from(element).save();
            } catch(e) {
                console.error("Erro ao gerar PDF:", e);
                alert("Erro ao gerar PDF.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function sortCompanies() {
            companies.sort((a, b) => {
                return a.name.localeCompare(b.name); // Alfabética fixa
            });
        }

        function renderStars(count) {
            count = parseInt(count);
            let starsHtml = '';
            for (let i = 0; i < 15; i++) {
                if (i < count) {
                    starsHtml += `<i class="fa-solid fa-star text-brand-lightGold star-glow text-[10px] md:text-sm"></i>`;
                } else {
                    starsHtml += `<i class="fa-solid fa-star text-gray-200 text-[10px] md:text-sm"></i>`;
                }
            }
            return starsHtml;
        }

        // Determina classes de destaque para o pódio
        function getPodiumClasses(index) {
            if (index === 0) return 'text-yellow-500 bg-yellow-50 border-yellow-200 shadow-inner scale-110';
            if (index === 1) return 'text-gray-400 bg-gray-50 border-gray-200 shadow-inner';
            if (index === 2) return 'text-amber-700 bg-amber-50 border-amber-200 shadow-inner';
            return 'text-gray-400 font-medium';
        }

        function render() {
            sortCompanies();
            companyListEl.innerHTML = '';

            if (companies.length === 0) {
                companyListEl.innerHTML = `
                    <div class="p-16 text-center flex flex-col items-center justify-center text-gray-400">
                        <i class="fa-regular fa-folder-open text-5xl mb-4 opacity-50"></i>
                        <p class="font-medium text-lg">Nenhuma empresa no ranking.</p>
                        <p class="text-sm mt-1">Adicione uma empresa no formulário acima para começar.</p>
                    </div>
                `;
                return;
            }

            companies.forEach((company, index) => {
                const isEditing = editingId === parseInt(company.id);
                const podiumClass = getPodiumClasses(index);
                const starsCount = parseInt(company.stars);
                
                const row = document.createElement('div');
                row.className = `flex items-stretch border-b border-gray-100 hover:bg-white hover:shadow-md transition-all group bg-white/30 duration-200`;
                
                // Posição com ícone de troféu para os 3 primeiros
                let posHtml = `<span class="text-lg">${index + 1}</span>`;
                if (index < 3) {
                    posHtml = `<div class="w-8 h-8 rounded-full flex items-center justify-center border ${podiumClass} font-bold text-sm transition-transform">
                                   ${index + 1}
                               </div>`;
                }

                row.innerHTML = `
                    <!-- Número -->
                    <div class="w-16 py-3 flex items-center justify-center font-bold text-gray-600">
                        ${posHtml}
                    </div>
                    
                    <!-- Nome da Empresa -->
                    <div class="w-1/3 py-3 px-4 flex items-center border-l border-white/50">
                        ${isEditing ? `
                            <div class="flex items-center gap-2 w-full">
                                <input
                                    type="text"
                                    id="edit-input-${company.id}"
                                    value="${company.name}"
                                    class="flex-1 px-3 py-1.5 border border-brand-blue/30 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-gold shadow-inner font-medium text-brand-blue"
                                />
                                <button data-action="save" data-id="${company.id}" class="text-green-600 hover:text-green-800 bg-green-50 hover:bg-green-100 p-1.5 rounded-md transition-colors shadow-sm">
                                    <i class="fa-solid fa-check"></i>
                                </button>
                            </div>
                        ` : `
                            <span class="font-bold text-brand-blue text-sm md:text-base truncate group-hover:text-brand-gold transition-colors">
                                ${company.name}
                            </span>
                        `}
                    </div>

                    <!-- Estrelas (Crédito) -->
                    <div class="flex-1 py-3 px-2 md:px-4 flex items-center justify-between border-l border-white/50">
                        <div class="flex items-center gap-[2px] flex-wrap">
                            ${renderStars(starsCount)}
                        </div>
                        
                        <!-- Controles de Estrela -->
                        <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity ml-2 bg-white rounded-lg shadow-sm border border-gray-100 p-0.5">
                            <button 
                                data-action="minus" data-id="${company.id}"
                                class="w-7 h-7 rounded text-red-500 hover:bg-red-50 hover:text-red-600 disabled:opacity-30 disabled:cursor-not-allowed transition-colors flex items-center justify-center"
                                title="Remover Estrela"
                                ${starsCount <= 0 ? 'disabled' : ''}
                            >
                                <i class="fa-solid fa-minus text-xs"></i>
                            </button>
                            <span class="text-xs font-bold w-5 text-center text-gray-700">${starsCount}</span>
                            <button 
                                data-action="plus" data-id="${company.id}"
                                class="w-7 h-7 rounded text-green-500 hover:bg-green-50 hover:text-green-600 disabled:opacity-30 disabled:cursor-not-allowed transition-colors flex items-center justify-center"
                                title="Adicionar Estrela"
                                ${starsCount >= 15 ? 'disabled' : ''}
                            >
                                <i class="fa-solid fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Ações (Editar/Excluir) -->
                    <div class="w-28 py-3 flex items-center justify-center gap-1.5 opacity-30 group-hover:opacity-100 transition-opacity border-l border-white/50">
                        <button
                            data-action="edit" data-id="${company.id}"
                            class="w-8 h-8 flex items-center justify-center text-blue-600 hover:bg-blue-50 hover:shadow-sm rounded-lg transition-all"
                            title="Editar Nome"
                        >
                            <i class="fa-solid fa-pen text-sm"></i>
                        </button>
                        <button
                            data-action="delete" data-id="${company.id}"
                            class="w-8 h-8 flex items-center justify-center text-red-500 hover:bg-red-50 hover:shadow-sm rounded-lg transition-all"
                            title="Remover Empresa"
                        >
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                `;

                companyListEl.appendChild(row);

                if (isEditing) {
                    const inputEl = document.getElementById(`edit-input-${company.id}`);
                    inputEl.focus();
                    inputEl.addEventListener('keyup', (e) => {
                        if (e.key === 'Enter') saveEdit(company.id, inputEl.value);
                    });
                }
            });
        }

        // --- Ações Locais que Chamam API ---
        function addCompany(name) {
            if (!name.trim()) return;
            apiAddCompany(name.trim());
        }

        function deleteCompany(id) {
            apiDeleteCompany(id);
        }

        function startEditing(id) {
            editingId = parseInt(id);
            render();
        }

        function saveEdit(id, newName) {
            if (newName.trim()) {
                apiUpdateCompany(id, { name: newName.trim() });
            }
            editingId = null;
            render(); // render imediato para remover o modo de edição visualmente
        }

        function updateStars(id, change) {
            const company = companies.find(c => parseInt(c.id) === parseInt(id));
            if (company) {
                let newStars = parseInt(company.stars) + change;
                if (newStars < 0) newStars = 0;
                if (newStars > 15) newStars = 15;
                
                // Otimista
                company.stars = newStars;
                render();
                
                // Persiste
                apiUpdateCompany(id, { stars: newStars });
            }
        }

        // --- Eventos ---
        addFormEl.addEventListener('submit', (e) => {
            e.preventDefault();
            addCompany(newCompanyNameEl.value);
            newCompanyNameEl.value = '';
        });

        companyListEl.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;

            const id = parseInt(btn.dataset.id);
            const action = btn.dataset.action;

            if (action === 'delete') deleteCompany(id);
            else if (action === 'plus') updateStars(id, 1);
            else if (action === 'minus') updateStars(id, -1);
            else if (action === 'edit') startEditing(id);
            else if (action === 'save') {
                const inputEl = document.getElementById(`edit-input-${id}`);
                saveEdit(id, inputEl.value);
            }
        });

        // Inicializa buscando as empresas do banco
        fetchCompanies();

    </script>
</body>
</html>
