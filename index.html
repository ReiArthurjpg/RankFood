<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking de Participação - Sebrae</title>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#0a192f',
                            lightBlue: '#112240',
                            gold: '#d4af37',
                            lightGold: '#f7b731',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- AutoAnimate -->
    <script src="https://cdn.jsdelivr.net/npm/@formkit/auto-animate@0.8.1/index.global.js"></script>

    <style>
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .star-glow {
            filter: drop-shadow(0 0 3px rgba(212, 175, 55, 0.6));
        }

        body {
            /* Elegant dark gradient background */
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 font-sans flex justify-center text-gray-800 items-start">

    <div class="max-w-4xl w-full glass-panel rounded-3xl overflow-hidden flex flex-col border border-white/50 shadow-2xl">
        
        <!-- Cabeçalho (Topo) -->
        <div class="bg-gradient-to-r from-brand-blue to-brand-lightBlue text-white p-8 relative overflow-hidden shadow-md">
            <!-- Fundo abstrato dourado -->
            <div class="absolute top-0 right-0 w-full h-full opacity-10 pointer-events-none">
                <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="w-full h-full">
                    <path d="M0,100 C20,0 50,0 100,100 Z" fill="#d4af37" />
                </svg>
            </div>
            
            <div class="relative z-10 flex justify-between items-center">
                <div>
                    <h1 class="text-3xl md:text-5xl font-black italic tracking-wider uppercase text-white/90 drop-shadow-sm">
                        Ranking de
                    </h1>
                    <h2 class="text-4xl md:text-6xl font-black italic tracking-wider uppercase text-transparent bg-clip-text bg-gradient-to-r from-brand-lightGold to-brand-gold drop-shadow-lg">
                        Participação
                    </h2>
                </div>
                <div class="text-right flex flex-col items-end">
                    <span class="font-bold text-xl md:text-2xl tracking-widest border-t-2 border-b-2 border-white/50 py-1 block">
                        SEBRAE
                    </span>
                </div>
            </div>
        </div>

        <!-- Seção de Logos -->
        <div class="flex flex-wrap justify-around items-center p-5 bg-white/50 border-b border-gray-200 shadow-inner">
            <div class="flex items-center gap-3 hover:scale-105 transition-transform cursor-default">
                <div class="w-12 h-12 rounded-full border-2 border-orange-500 bg-orange-50 flex items-center justify-center text-orange-500 font-black text-2xl shadow-sm">C</div>
                <div class="text-sm font-bold text-brand-blue leading-tight uppercase">Rescer<br/><span class="text-[10px] font-medium text-gray-500">Consultoria Empresarial</span></div>
            </div>
            <div class="flex items-center gap-3 hover:scale-105 transition-transform cursor-default">
                <div class="w-10 h-12 border-2 border-brand-blue bg-blue-50 rounded-lg flex items-center justify-center text-brand-blue font-black text-2xl shadow-sm">P</div>
                <div class="text-sm font-bold text-brand-blue leading-tight uppercase">Proativa<br/><span class="text-[10px] font-medium text-gray-500">Consultoria de Alimentos</span></div>
            </div>
            <div class="text-center hover:scale-105 transition-transform cursor-default">
                <div class="text-2xl font-black text-gray-900 lowercase tracking-tighter">torres</div>
                <div class="flex items-center justify-center gap-1 text-[10px]">
                    <span class="text-purple-700 font-bold uppercase">fintech</span>
                    <span class="text-gray-500 leading-tight">Contabilidade &<br/>BPO financeiro</span>
                </div>
            </div>
        </div>

        <!-- Controles: Adicionar Empresa -->
        <div class="p-5 bg-gray-50/80 border-b border-gray-200">
            <form id="add-form" class="flex gap-3 max-w-2xl mx-auto">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-building text-gray-400"></i>
                    </div>
                    <input
                        type="text"
                        id="new-company-name"
                        placeholder="Nome da nova empresa..."
                        class="w-full pl-12 pr-4 py-3 border border-gray-200 rounded-xl bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-gold focus:border-transparent transition-all text-sm font-medium"
                    />
                </div>
                <button
                    type="submit"
                    class="px-6 py-3 bg-brand-blue text-white font-bold rounded-xl shadow-md hover:bg-brand-lightBlue hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 focus:outline-none focus:ring-2 focus:ring-brand-gold transition-all flex items-center gap-2"
                >
                    <i class="fa-solid fa-plus"></i>
                    Adicionar
                </button>
            </form>
        </div>

        <!-- Cabeçalho da Tabela -->
        <div class="flex bg-gray-100/90 text-gray-500 font-bold text-[11px] md:text-xs uppercase tracking-wider border-b border-gray-200">
            <div class="w-16 py-4 text-center">Pos</div>
            <div class="w-1/3 py-4 px-4">Empresa</div>
            <div class="flex-1 py-4 px-4 text-center">Crédito</div>
            <div class="w-28 py-4 px-2 text-center">Ações</div>
        </div>

        <!-- Corpo da Tabela (Lista Dinâmica) -->
        <div id="company-list" class="flex-1 overflow-y-auto max-h-[55vh] bg-white/50">
            <!-- As empresas serão renderizadas aqui -->
        </div>

        <!-- Rodapé -->
        <div class="bg-gradient-to-r from-brand-blue to-brand-lightBlue text-white p-6 relative">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-brand-gold to-transparent opacity-50"></div>
            
            <div class="flex flex-col items-center justify-center gap-2 mb-6 mt-2">
                <div class="bg-white/10 backdrop-blur-sm rounded-full p-3 shadow-inner border border-white/20">
                    <i class="fa-solid fa-crown text-brand-lightGold text-2xl"></i>
                </div>
                <h3 class="text-brand-lightGold font-bold text-xs tracking-widest uppercase">Clube de Líderes</h3>
                <h4 class="text-2xl font-black tracking-wide text-white">Sebrae Profood</h4>
            </div>
            
            <div class="bg-white/10 backdrop-blur-md rounded-2xl py-3 px-6 flex flex-wrap justify-center gap-8 md:gap-16 items-center text-xs sm:text-sm font-medium border border-white/20 shadow-lg">
                <div class="flex items-center gap-3">
                    <div class="bg-white/20 p-2 rounded-lg">
                        <i class="fa-solid fa-users text-white text-lg"></i>
                    </div>
                    <div>
                        <span class="text-brand-lightGold font-bold text-[10px] uppercase tracking-wider block mb-0.5">Consultores</span>
                        <span class="font-light">Marluce, Thiago e Gabriel</span>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="bg-white/20 p-2 rounded-lg">
                        <i class="fa-solid fa-user-tie text-white text-lg"></i>
                    </div>
                    <div>
                        <span class="text-brand-lightGold font-bold text-[10px] uppercase tracking-wider block mb-0.5">Gestora</span>
                        <span class="font-light">Kamila</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Lógica do Sistema em JavaScript -->
    <script>
        // Inicializa o AutoAnimate na lista para transições de reordenação suaves
        const companyListEl = document.getElementById('company-list');
        if (window.formkitAutoAnimate) {
            window.formkitAutoAnimate(companyListEl, { duration: 300, easing: 'ease-out' });
        }

        // Estado
        let companies = [];
        let editingId = null;
        
        const apiUrl = 'api.php';

        const addFormEl = document.getElementById('add-form');
        const newCompanyNameEl = document.getElementById('new-company-name');
        
        // --- Comunicação com a API ---
        async function fetchCompanies() {
            try {
                const res = await fetch(apiUrl);
                companies = await res.json();
                render();
            } catch (err) {
                console.error('Erro ao buscar empresas:', err);
            }
        }

        async function apiAddCompany(name) {
            try {
                await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, stars: 0 })
                });
                await fetchCompanies(); // Recarrega lista
            } catch (err) {
                console.error('Erro ao adicionar empresa:', err);
            }
        }

        async function apiUpdateCompany(id, updates) {
            try {
                await fetch(apiUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, ...updates })
                });
                await fetchCompanies();
            } catch (err) {
                console.error('Erro ao atualizar empresa:', err);
            }
        }

        async function apiDeleteCompany(id) {
            try {
                await fetch(apiUrl, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                await fetchCompanies();
            } catch (err) {
                console.error('Erro ao deletar empresa:', err);
            }
        }

        function sortCompanies() {
            companies.sort((a, b) => {
                const aStars = parseInt(a.stars);
                const bStars = parseInt(b.stars);
                if (bStars !== aStars) {
                    return bStars - aStars; // Decrescente por estrelas
                }
                return a.name.localeCompare(b.name); // Alfabética para desempate
            });
        }

        function renderStars(count) {
            count = parseInt(count);
            let starsHtml = '';
            for (let i = 0; i < 20; i++) {
                if (i < count) {
                    starsHtml += `<i class="fa-solid fa-star text-brand-lightGold star-glow text-[10px] md:text-sm"></i>`;
                } else {
                    starsHtml += `<i class="fa-solid fa-star text-gray-200 text-[10px] md:text-sm"></i>`;
                }
            }
            return starsHtml;
        }

        // Determina classes de destaque para o pódio
        function getPodiumClasses(index) {
            if (index === 0) return 'text-yellow-500 bg-yellow-50 border-yellow-200 shadow-inner scale-110';
            if (index === 1) return 'text-gray-400 bg-gray-50 border-gray-200 shadow-inner';
            if (index === 2) return 'text-amber-700 bg-amber-50 border-amber-200 shadow-inner';
            return 'text-gray-400 font-medium';
        }

        function render() {
            sortCompanies();
            companyListEl.innerHTML = '';

            if (companies.length === 0) {
                companyListEl.innerHTML = `
                    <div class="p-16 text-center flex flex-col items-center justify-center text-gray-400">
                        <i class="fa-regular fa-folder-open text-5xl mb-4 opacity-50"></i>
                        <p class="font-medium text-lg">Nenhuma empresa no ranking.</p>
                        <p class="text-sm mt-1">Adicione uma empresa no formulário acima para começar.</p>
                    </div>
                `;
                return;
            }

            companies.forEach((company, index) => {
                const isEditing = editingId === parseInt(company.id);
                const podiumClass = getPodiumClasses(index);
                const starsCount = parseInt(company.stars);
                
                const row = document.createElement('div');
                row.className = `flex items-stretch border-b border-gray-100 hover:bg-white hover:shadow-md transition-all group bg-white/30 duration-200`;
                
                // Posição com ícone de troféu para os 3 primeiros
                let posHtml = `<span class="text-lg">${index + 1}</span>`;
                if (index < 3) {
                    posHtml = `<div class="w-8 h-8 rounded-full flex items-center justify-center border ${podiumClass} font-bold text-sm transition-transform">
                                   ${index + 1}
                               </div>`;
                }

                row.innerHTML = `
                    <!-- Número -->
                    <div class="w-16 py-3 flex items-center justify-center font-bold text-gray-600">
                        ${posHtml}
                    </div>
                    
                    <!-- Nome da Empresa -->
                    <div class="w-1/3 py-3 px-4 flex items-center border-l border-white/50">
                        ${isEditing ? `
                            <div class="flex items-center gap-2 w-full">
                                <input
                                    type="text"
                                    id="edit-input-${company.id}"
                                    value="${company.name}"
                                    class="flex-1 px-3 py-1.5 border border-brand-blue/30 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-gold shadow-inner font-medium text-brand-blue"
                                />
                                <button data-action="save" data-id="${company.id}" class="text-green-600 hover:text-green-800 bg-green-50 hover:bg-green-100 p-1.5 rounded-md transition-colors shadow-sm">
                                    <i class="fa-solid fa-check"></i>
                                </button>
                            </div>
                        ` : `
                            <span class="font-bold text-brand-blue text-sm md:text-base truncate group-hover:text-brand-gold transition-colors">
                                ${company.name}
                            </span>
                        `}
                    </div>

                    <!-- Estrelas (Crédito) -->
                    <div class="flex-1 py-3 px-2 md:px-4 flex items-center justify-between border-l border-white/50">
                        <div class="flex items-center gap-[2px] flex-wrap">
                            ${renderStars(starsCount)}
                        </div>
                        
                        <!-- Controles de Estrela -->
                        <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity ml-2 bg-white rounded-lg shadow-sm border border-gray-100 p-0.5">
                            <button 
                                data-action="minus" data-id="${company.id}"
                                class="w-7 h-7 rounded text-red-500 hover:bg-red-50 hover:text-red-600 disabled:opacity-30 disabled:cursor-not-allowed transition-colors flex items-center justify-center"
                                title="Remover Estrela"
                                ${starsCount <= 0 ? 'disabled' : ''}
                            >
                                <i class="fa-solid fa-minus text-xs"></i>
                            </button>
                            <span class="text-xs font-bold w-5 text-center text-gray-700">${starsCount}</span>
                            <button 
                                data-action="plus" data-id="${company.id}"
                                class="w-7 h-7 rounded text-green-500 hover:bg-green-50 hover:text-green-600 disabled:opacity-30 disabled:cursor-not-allowed transition-colors flex items-center justify-center"
                                title="Adicionar Estrela"
                                ${starsCount >= 20 ? 'disabled' : ''}
                            >
                                <i class="fa-solid fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Ações (Editar/Excluir) -->
                    <div class="w-28 py-3 flex items-center justify-center gap-1.5 opacity-30 group-hover:opacity-100 transition-opacity border-l border-white/50">
                        <button
                            data-action="edit" data-id="${company.id}"
                            class="w-8 h-8 flex items-center justify-center text-blue-600 hover:bg-blue-50 hover:shadow-sm rounded-lg transition-all"
                            title="Editar Nome"
                        >
                            <i class="fa-solid fa-pen text-sm"></i>
                        </button>
                        <button
                            data-action="delete" data-id="${company.id}"
                            class="w-8 h-8 flex items-center justify-center text-red-500 hover:bg-red-50 hover:shadow-sm rounded-lg transition-all"
                            title="Remover Empresa"
                        >
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                `;

                companyListEl.appendChild(row);

                if (isEditing) {
                    const inputEl = document.getElementById(`edit-input-${company.id}`);
                    inputEl.focus();
                    inputEl.addEventListener('keyup', (e) => {
                        if (e.key === 'Enter') saveEdit(company.id, inputEl.value);
                    });
                }
            });
        }

        // --- Ações Locais que Chamam API ---
        function addCompany(name) {
            if (!name.trim()) return;
            apiAddCompany(name.trim());
        }

        function deleteCompany(id) {
            apiDeleteCompany(id);
        }

        function startEditing(id) {
            editingId = parseInt(id);
            render();
        }

        function saveEdit(id, newName) {
            if (newName.trim()) {
                apiUpdateCompany(id, { name: newName.trim() });
            }
            editingId = null;
            render(); // render imediato para remover o modo de edição visualmente
        }

        function updateStars(id, change) {
            const company = companies.find(c => parseInt(c.id) === parseInt(id));
            if (company) {
                let newStars = parseInt(company.stars) + change;
                if (newStars < 0) newStars = 0;
                if (newStars > 20) newStars = 20;
                
                // Otimista
                company.stars = newStars;
                render();
                
                // Persiste
                apiUpdateCompany(id, { stars: newStars });
            }
        }

        // --- Eventos ---
        addFormEl.addEventListener('submit', (e) => {
            e.preventDefault();
            addCompany(newCompanyNameEl.value);
            newCompanyNameEl.value = '';
        });

        companyListEl.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;

            const id = parseInt(btn.dataset.id);
            const action = btn.dataset.action;

            if (action === 'delete') deleteCompany(id);
            else if (action === 'plus') updateStars(id, 1);
            else if (action === 'minus') updateStars(id, -1);
            else if (action === 'edit') startEditing(id);
            else if (action === 'save') {
                const inputEl = document.getElementById(`edit-input-${id}`);
                saveEdit(id, inputEl.value);
            }
        });

        // Inicializa buscando as empresas do banco
        fetchCompanies();

    </script>
</body>
</html>
