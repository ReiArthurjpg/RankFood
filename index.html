<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking de Participação - Sebrae</title>
    <!-- Tailwind CSS para estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Estilização personalizada da barra de rolagem para combinar com o design */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="min-h-screen bg-gray-300 p-4 md:p-8 font-sans flex justify-center">

    <div class="max-w-4xl w-full bg-white shadow-2xl rounded-xl overflow-hidden flex flex-col">
        
        <!-- Cabeçalho (Topo) -->
        <div class="bg-[#0b1f40] text-white p-6 relative overflow-hidden">
            <!-- Fundo abstrato dourado -->
            <div class="absolute top-0 right-0 w-full h-full opacity-20 pointer-events-none">
                <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="w-full h-full">
                    <path d="M0,0 Q50,50 100,0 L100,100 L0,100 Z" fill="#d4af37" />
                </svg>
            </div>
            
            <div class="relative z-10 flex justify-between items-center">
                <div>
                    <h1 class="text-3xl md:text-5xl font-black italic tracking-wider uppercase text-white drop-shadow-md">
                        Ranking de
                    </h1>
                    <h2 class="text-4xl md:text-6xl font-black italic tracking-wider uppercase text-[#f7b731] drop-shadow-md">
                        Participação
                    </h2>
                </div>
                <div class="text-right">
                    <span class="font-bold text-xl md:text-2xl tracking-widest border-t-4 border-b-4 border-white py-1 block">
                        SEBRAE
                    </span>
                </div>
            </div>
        </div>

        <!-- Seção de Logos -->
        <div class="flex flex-wrap justify-around items-center p-4 bg-gray-50 border-b-4 border-[#0b1f40]">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-full border-2 border-orange-500 flex items-center justify-center text-orange-500 font-bold text-xl">C</div>
                <div class="text-sm font-bold text-[#0b1f40] leading-tight">RESCER<br/><span class="text-[10px] font-normal text-gray-500">CONSULTORIA EMPRESARIAL</span></div>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-8 h-10 border-2 border-blue-900 rounded-lg flex items-center justify-center text-blue-900 font-bold">P</div>
                <div class="text-sm font-bold text-[#0b1f40] leading-tight">PROATIVA<br/><span class="text-[10px] font-normal text-gray-500">CONSULTORIA DE ALIMENTOS</span></div>
            </div>
            <div class="text-center">
                <div class="text-xl font-bold text-black lowercase tracking-tighter">torres</div>
                <div class="flex items-center justify-center gap-1 text-[10px]">
                    <span class="text-purple-700 font-bold">fintech</span>
                    <span class="text-gray-500">Contabilidade &<br/>BPO financeiro</span>
                </div>
            </div>
        </div>

        <!-- Controles: Adicionar Empresa -->
        <div class="p-4 bg-blue-50 border-b border-gray-200">
            <form id="add-form" class="flex gap-2">
                <input
                    type="text"
                    id="new-company-name"
                    placeholder="Nome da nova empresa..."
                    class="flex-1 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#0b1f40]"
                />
                <button
                    type="submit"
                    class="px-4 py-2 bg-[#0b1f40] text-white rounded-md hover:bg-blue-900 focus:outline-none focus:ring-2 focus:ring-[#0b1f40] flex items-center gap-2 transition-colors"
                >
                    <i class="fa-solid fa-plus"></i>
                    Adicionar
                </button>
            </form>
        </div>

        <!-- Cabeçalho da Tabela -->
        <div class="flex bg-[#0b1f40] text-white font-bold text-sm md:text-base">
            <div class="w-12 py-3 text-center border-r border-white/20">Nº</div>
            <div class="w-1/3 py-3 px-4 border-r border-white/20">EMPRESA</div>
            <div class="flex-1 py-3 px-4 text-center bg-[#d49a37]">CRÉDITO</div>
            <div class="w-24 py-3 px-2 text-center bg-[#0b1f40]">AÇÕES</div>
        </div>

        <!-- Corpo da Tabela (Lista Dinâmica) -->
        <div id="company-list" class="flex-1 overflow-y-auto max-h-[60vh] bg-white">
            <!-- As empresas serão renderizadas aqui pelo JavaScript -->
        </div>

        <!-- Rodapé -->
        <div class="bg-[#0b1f40] text-white p-4">
            <div class="flex flex-col items-center justify-center gap-1 mb-4">
                <div class="bg-blue-900 rounded-full p-2 border-2 border-white/20 shadow-lg">
                    <i class="fa-solid fa-users text-white text-xl"></i>
                </div>
                <h3 class="text-[#f7b731] font-bold text-sm">Clube de líderes</h3>
                <h4 class="text-xl font-bold">Sebrae profood</h4>
            </div>
            
            <div class="bg-white text-gray-800 rounded-full py-2 px-6 flex flex-wrap justify-between items-center text-xs sm:text-sm font-semibold max-w-2xl mx-auto border-4 border-gray-200">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-users text-[#0b1f40] text-lg"></i>
                    <div>
                        <span class="text-[#0b1f40]">CONSULTORES:</span><br/>
                        <span class="font-normal">Marluce, Thiago e Gabriel</span>
                    </div>
                </div>
                <div class="hidden sm:block w-px h-8 bg-gray-300"></div>
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-circle-user text-[#0b1f40] text-xl"></i>
                    <div>
                        <span class="text-[#0b1f40]">GESTORA:</span><br/>
                        <span class="font-normal">Kamila</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Lógica do Sistema em JavaScript -->
    <script>
        // Estado inicial
        const defaultCompanies = [
            { id: 1, name: "Brother's Burguer", stars: 15 },
            { id: 2, name: "Torres Pizza", stars: 15 },
            { id: 3, name: "Ulin Lanches", stars: 15 },
            { id: 4, name: "D'Cakes", stars: 15 },
            { id: 5, name: "Divorari", stars: 15 },
            { id: 6, name: "Seu Bibi Pastelaria", stars: 15 },
            { id: 7, name: "Imperial Pizza", stars: 15 },
        ];

        let companies = JSON.parse(localStorage.getItem('ranking_companies')) || defaultCompanies;

        // Função para salvar no LocalStorage
        function saveCompanies() {
            localStorage.setItem('ranking_companies', JSON.stringify(companies));
        }

        let editingId = null;

        // Elementos DOM
        const companyListEl = document.getElementById('company-list');
        const addFormEl = document.getElementById('add-form');
        const newCompanyNameEl = document.getElementById('new-company-name');

        // Função para ordenar as empresas (por estrelas decrescente, depois nome)
        function sortCompanies() {
            companies.sort((a, b) => {
                if (b.stars !== a.stars) {
                    return b.stars - a.stars;
                }
                return a.name.localeCompare(b.name);
            });
        }

        // Função para renderizar as estrelas em HTML
        function renderStars(count) {
            let starsHtml = '';
            for (let i = 0; i < 20; i++) {
                if (i < count) {
                    starsHtml += `<i class="fa-solid fa-star text-green-800 text-xs md:text-sm"></i>`;
                } else {
                    starsHtml += `<i class="fa-solid fa-star text-gray-200 text-xs md:text-sm"></i>`;
                }
            }
            return starsHtml;
        }

        // Função principal para desenhar a lista na tela
        function render() {
            sortCompanies();
            companyListEl.innerHTML = ''; // Limpa a lista atual

            if (companies.length === 0) {
                companyListEl.innerHTML = `
                    <div class="p-8 text-center text-gray-500">
                        Nenhuma empresa na lista. Adicione uma acima.
                    </div>
                `;
                return;
            }

            companies.forEach((company, index) => {
                const isEven = index % 2 === 0;
                const bgClass = isEven ? 'bg-white' : 'bg-gray-50/50';
                const isEditing = editingId === company.id;

                // Montagem do HTML de cada linha
                const row = document.createElement('div');
                row.className = `flex items-stretch border-b border-gray-200 hover:bg-gray-100 transition-colors group ${bgClass}`;
                
                row.innerHTML = `
                    <!-- Número -->
                    <div class="w-12 py-3 flex items-center justify-center font-bold text-[#0b1f40] border-r border-gray-200">
                        ${index + 1}
                    </div>
                    
                    <!-- Nome da Empresa -->
                    <div class="w-1/3 py-3 px-4 flex items-center border-r border-gray-200">
                        ${isEditing ? `
                            <div class="flex items-center gap-2 w-full">
                                <input
                                    type="text"
                                    id="edit-input-${company.id}"
                                    value="${company.name}"
                                    class="flex-1 px-2 py-1 border border-gray-400 rounded text-sm focus:outline-none focus:ring-2 focus:ring-[#0b1f40]"
                                />
                                <button data-action="save" data-id="${company.id}" class="text-green-600 hover:text-green-800">
                                    <i class="fa-solid fa-check"></i>
                                </button>
                            </div>
                        ` : `
                            <span class="font-semibold text-[#1e3a8a] text-sm md:text-base truncate">
                                ${company.name}
                            </span>
                        `}
                    </div>

                    <!-- Estrelas (Crédito) -->
                    <div class="flex-1 py-3 px-2 md:px-4 flex items-center justify-between border-r border-gray-200">
                        <div class="flex items-center gap-[2px]">
                            ${renderStars(company.stars)}
                        </div>
                        
                        <!-- Controles de Estrela -->
                        <div class="flex gap-1 opacity-0 group-hover:opacity-100 sm:opacity-100 transition-opacity ml-2">
                            <button 
                                data-action="minus" data-id="${company.id}"
                                class="p-1 rounded bg-red-100 text-red-600 hover:bg-red-200 disabled:opacity-30 disabled:cursor-not-allowed"
                                title="Remover Estrela"
                                ${company.stars <= 0 ? 'disabled' : ''}
                            >
                                <i class="fa-solid fa-minus text-xs"></i>
                            </button>
                            <span class="text-xs font-bold w-6 text-center leading-relaxed">${company.stars}</span>
                            <button 
                                data-action="plus" data-id="${company.id}"
                                class="p-1 rounded bg-green-100 text-green-600 hover:bg-green-200 disabled:opacity-30 disabled:cursor-not-allowed"
                                title="Adicionar Estrela"
                                ${company.stars >= 20 ? 'disabled' : ''}
                            >
                                <i class="fa-solid fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Ações (Editar/Excluir) -->
                    <div class="w-24 py-3 flex items-center justify-center gap-2">
                        <button
                            data-action="edit" data-id="${company.id}"
                            class="p-1.5 text-blue-600 hover:bg-blue-100 rounded transition-colors"
                            title="Editar Nome"
                        >
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button
                            data-action="delete" data-id="${company.id}"
                            class="p-1.5 text-red-600 hover:bg-red-100 rounded transition-colors"
                            title="Remover Empresa"
                        >
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;

                companyListEl.appendChild(row);

                // Auto-focus no input se estiver editando
                if (isEditing) {
                    const inputEl = document.getElementById(`edit-input-${company.id}`);
                    inputEl.focus();
                    // Salva com "Enter"
                    inputEl.addEventListener('keyup', (e) => {
                        if (e.key === 'Enter') saveEdit(company.id, inputEl.value);
                    });
                }
            });
        }

        // --- Ações / Lógica de Estado ---

        function addCompany(name) {
            if (!name.trim()) return;
            const newCompany = {
                id: Date.now(), // Gera um ID único baseado no tempo
                name: name.trim(),
                stars: 0 // Começa com 0 estrelas
            };
            companies.push(newCompany);
            saveCompanies();
            render();
        }

        function deleteCompany(id) {
            companies = companies.filter(c => c.id !== id);
            saveCompanies();
            render();
        }

        function startEditing(id) {
            editingId = id;
            render();
        }

        function saveEdit(id, newName) {
            const company = companies.find(c => c.id === id);
            if (company && newName.trim()) {
                company.name = newName.trim();
                saveCompanies();
            }
            editingId = null;
            render();
        }

        function updateStars(id, change) {
            const company = companies.find(c => c.id === id);
            if (company) {
                let newStars = company.stars + change;
                // Limita entre 0 e 20
                if (newStars < 0) newStars = 0;
                if (newStars > 20) newStars = 20;
                
                company.stars = newStars;
                saveCompanies();
                render();
            }
        }

        // --- Event Listeners ---

        // Submissão do formulário de adição
        addFormEl.addEventListener('submit', (e) => {
            e.preventDefault();
            addCompany(newCompanyNameEl.value);
            newCompanyNameEl.value = ''; // Limpa o input
        });

        // Delegação de eventos para os botões dentro da lista dinâmica
        companyListEl.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return; // Não clicou em um botão

            const id = parseInt(btn.dataset.id);
            const action = btn.dataset.action;

            if (action === 'delete') {
                deleteCompany(id);
            } else if (action === 'plus') {
                updateStars(id, 1);
            } else if (action === 'minus') {
                updateStars(id, -1);
            } else if (action === 'edit') {
                startEditing(id);
            } else if (action === 'save') {
                const inputEl = document.getElementById(`edit-input-${id}`);
                saveEdit(id, inputEl.value);
            }
        });

        // Inicializa a renderização na primeira carga
        render();

    </script>
</body>
</html>
